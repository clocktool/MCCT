<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MCCT — Minecraft 基岩版命令工具">
  <title>MCCT — Minecraft 基岩版命令工具</title>

  <!-- 样式：按依赖顺序引入 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ===== 内联 SVG 图标库（无外部依赖，无 emoji） ===== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
    <!-- 太阳 -->
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </symbol>
    <!-- 月亮 -->
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
    <!-- 侧栏 -->
    <symbol id="icon-sidebar" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <line x1="9" y1="4" x2="9" y2="20"/>
    </symbol>
    <!-- 关闭 -->
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <!-- 复制当前行 -->
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <!-- 全部复制（带清空箭头感） -->
    <symbol id="icon-copy-all" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="12" height="12" rx="2"/>
      <path d="M8 4h10a2 2 0 0 1 2 2v10"/>
      <path d="M6 14h6M6 17h4"/>
    </symbol>
    <!-- 垃圾桶 -->
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </symbol>
  </svg>

  <!-- ===== 应用根容器 ===== -->
  <div id="app" class="app">

    <!-- ===== 顶部工具栏 ===== -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <h1 class="app-logo">MCCT</h1>
        <span class="app-subtitle">Minecraft 基岩版命令工具</span>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-theme" title="切换主题" aria-label="切换主题">
          <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"/></svg>
          <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"/></svg>
        </button>
        <button class="btn-icon" id="btn-toggle-sidebar" title="折叠/展开 ID 表" aria-label="折叠或展开 ID 表">
          <svg class="icon" aria-hidden="true"><use href="#icon-sidebar"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== 主体区域：编辑器 + 侧边栏 ===== -->
    <div class="app-body" id="app-body">

      <!-- 编辑器区域 -->
      <main class="editor-area" id="editor-area">
        <div class="editor-wrapper" id="editor-wrapper">
          <!-- 行号栏 -->
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <!-- 滚动容器：高亮层 + 输入层叠加 -->
          <div class="scroller" id="scroller">
            <!-- 高亮渲染层（只读，不接收事件） -->
            <pre class="layer layer-highlight" id="highlight-layer"><code id="highlight-code"></code></pre>
            <!-- 输入层（透明文字，保留光标与选择） -->
            <textarea
              class="layer layer-input"
              id="editor-input"
              spellcheck="false"
              autocapitalize="off"
              autocorrect="off"
              wrap="off"
              aria-label="命令编辑器"
              placeholder="/execute as @a at @s run setblock ~ ~1 ~ minecraft:stone"
            ></textarea>
          </div>
        </div>

        <!-- 编辑器底部工具栏 -->
        <div class="editor-toolbar" id="editor-toolbar">
          <div class="toolbar-left">
            <button class="btn-text" id="btn-copy" title="复制当前行；如有选中则复制选中内容（Ctrl+Shift+C）">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-copy"/></svg>
              <span class="btn-text-label">复制</span>
            </button>
            <button class="btn-text" id="btn-copy-all" title="复制全部内容，复制后自动清空编辑器">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-copy-all"/></svg>
              <span class="btn-text-label">全部复制</span>
            </button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button class="btn-text" id="btn-clear" title="清空编辑器">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-trash"/></svg>
              <span class="btn-text-label">清空</span>
            </button>
          </div>
          <div class="toolbar-right">
            <span class="toolbar-hint" id="toolbar-hint">Ctrl+Shift+C 复制当前行</span>
          </div>
        </div>
      </main>

      <!-- ID 表侧边栏 -->
      <aside class="sidebar" id="sidebar" aria-label="ID 表浏览器">
        <div class="sidebar-header">
          <h2 class="sidebar-title">ID 表</h2>
          <button class="btn-icon btn-close-sidebar" id="btn-close-sidebar" title="关闭" aria-label="关闭 ID 表">
            <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
          </button>
        </div>

        <!-- 分类标签 -->
        <div class="sidebar-tabs" id="sidebar-tabs" role="tablist">
          <button class="tab is-active" data-category="block" role="tab" aria-selected="true">方块</button>
          <button class="tab" data-category="item" role="tab" aria-selected="false">物品</button>
          <button class="tab" data-category="entity" role="tab" aria-selected="false">实体</button>
          <button class="tab" data-category="effect" role="tab" aria-selected="false">效果</button>
          <button class="tab" data-category="enchant" role="tab" aria-selected="false">魔咒</button>
          <button class="tab" data-category="animation" role="tab" aria-selected="false">动画</button>
          <button class="tab" data-category="sound" role="tab" aria-selected="false">声音</button>
        </div>

        <!-- 搜索框 -->
        <div class="sidebar-search">
          <input type="search" id="id-search" class="search-input" placeholder="搜索 ID 或中文名…" aria-label="搜索 ID">
        </div>

        <!-- 结果列表 -->
        <ul class="id-list" id="id-list" role="listbox" aria-label="ID 列表">
          <li class="id-list-empty">选择分类后加载数据…</li>
        </ul>

        <!-- 拖拽调整宽度的把手 -->
        <div class="sidebar-resizer" id="sidebar-resizer" aria-hidden="true"></div>
      </aside>

    </div>

    <!-- ===== 状态栏 ===== -->
    <footer class="app-statusbar" id="app-statusbar">
      <div class="status-left">
        <span class="status-item" id="status-version">适配基岩版 1.26.60.30</span>
        <span class="status-sep">|</span>
        <span class="status-item" id="status-mode">原版</span>
      </div>
      <div class="status-right">
        <span class="status-item status-error hidden" id="status-error">0 个错误</span>
        <span class="status-item" id="status-caret">行 1, 列 1</span>
      </div>
    </footer>

  </div>

  <!-- ===== 脚本：按依赖顺序引入 ===== -->
  <script src="js/core/bus.js"></script>
  <script src="js/data/commands.js"></script>
  <script src="js/data/loader.js"></script>
  <script src="js/core/tokenizer.js"></script>
  <script src="js/core/parser.js"></script>
  <script src="js/core/highlighter.js"></script>
  <script src="js/core/completer.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/dropdown.js"></script>
  <script src="js/ui/idbrowser.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
